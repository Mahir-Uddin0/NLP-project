services:
  - type: web
    name: nlp-suite-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LARA_ACCESS_KEY_ID
        sync: false
      - key: LARA_ACCESS_KEY_SECRET
        sync: false
      - key: OCR_SPACE_API_KEY
        sync: false
